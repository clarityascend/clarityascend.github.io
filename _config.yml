# Site settings for Jekyll + Chirpy
# Docs: https://github.com/cotes2020/jekyll-theme-chirpy

theme: jekyll-theme-chirpy

lang: en
# e.g. Europe/London, Asia/Shanghai — leave empty for UTC
timezone: Australia/Melbourne

title: MultiValue Modernization
tagline: UniVerse, UniData and the tools around them
description: >-
  Guides, history and tools for modernizing MultiValue (Pick) databases
  such as Rocket UniVerse and UniData: MVBU for Chrome and VS Code, and MVBA.

url: "https://clarityascend.github.io"
baseurl: ""

github:
  username: clarityascend

twitter:
  username:

social:
  name: Clarity Ascend
  email: # optional, shown publicly
  links:
    - https://github.com/clarityascend
    - https://clarityascend.com/MVBU
    - https://discord.gg/xxhAD77RVx

# Search engine verification codes (see README, "SEO")
webmaster_verifications:
  google: # code from Google Search Console
  bing: # code from Bing Webmaster Tools

# Discord invite, shown in the footer and the sidebar
discord_url: "https://discord.gg/xxhAD77RVx"

avatar: /assets/img/avatar.png
# 1200 x 630 image shown when a page is shared
social_preview_image: /assets/img/social-preview.png

theme_mode: # [light | dark] — empty follows the visitor's system
toc: true
paginate: 10

comments:
  provider: # [disqus | utterances | giscus]

assets:
  self_host:
    enabled: false

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:
      - "/mv-modernization/"

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gemspec"
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
